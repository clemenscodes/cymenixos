  # False, because the title explains itself and we were stopping it.
  #
  # Its executable carries the whole co-op failure path as plain strings,
  # `NetEventCoopTeamFailed - fails = %i` at 0x0b3d630, `Missing coop spawner
  # for player '%s'!` at 0x0b40000, and `NetGameManager - no player matching
  # coop id %s` at 0x0b400f8. With this on, not one of them reaches the TTY
  # while `VbManager` and `EntitySpawner` fill it, so the network half is the
  # exact half that is silenced.
  #
  # A single player co-op match ends by itself after about eighteen seconds
  # with `Mission Failed!` and no checkpoints, and the server is proven not to
  # be the cause, no notification is sent and every reply is inside 25 ms. The
  # reason is in the title and the title will say it.
  #
  # Turn it back on when the question is answered. It costs frame rate and a
  # large log while it is off.
  Silence All Logs: false
  Start games in fullscreen mode: true
  Use native user interface: true
  Use recursive scan: false
  Window Title Format: "FPS: %F | %R | %V | %T [%t]"
Net:
  # Which local address this console's own sockets bind, and every
  # address is right because this console has a machine to itself.
  #
  # **This presumes a network namespace of its own**, drawn by
  # plunderfall's tools/uncharted-console-network.sh, and it is
  # wrong without one. Started on the bare desktop beside a server
  # this value takes ports away from everything, so the namespace
  # is a precondition rather than a convenience.
  #
  # # What this used to be, and why it stopped being right
  #
  # It read 127.0.0.1 until 2026-09-02, with one loopback address
  # handed out per title, because Uncharted 2 binds UDP 3233
  # itself. It sends its PlayStation Network ticket from that port
  # and waits on the same one, so it has to hold it, and a server
  # sharing the machine on 0.0.0.0 holds it on every address at
  # once. The title's own bind then fails with EADDRINUSE and what
  # a player sees is `Error initializing socket`, which is
  # `socket.Init() failed. 0x%x` at 0x00b3a6a8 in its own
  # executable and names no port at all. An address each was what
  # let both hold 3233.
  #
  # **That answer stopped working when the server moved into
  # containers, and no setting brings it back.** A packet sent from
  # a loopback address to a published port is rewritten onto the
  # container's own network and arrives there carrying a source of
  # 127.0.0.1, which inside that container is the container, so the
  # reply is sent to itself. Measured on 2026-09-02, the SYN
  # arrives on the container's interface and no SYN ACK is ever
  # emitted, and route_localnet on the bridge, in the container and
  # on both changes nothing, because the fault is that the answer
  # has nowhere to go rather than that the question was refused.
  #
  # # Why the namespace settles it rather than working around it
  #
  # A console with an interface and an address of its own is what a
  # console is on hardware and what a player is against a deployed
  # server, so the desk stops being a special case that has to be
  # reasoned about separately. 3233 is free in there, the fixed
  # peer to peer port 3658 is free in there, and two consoles are
  # two namespaces that collide in nothing, which is what the table
  # of loopback addresses existed to arrange.
  #
  # It also fixes what that table could never fix. A server answers
  # the address question with the source it saw, so a console on a
  # loopback address was recorded at one, which nothing off this
  # machine can reach. A console in a namespace is recorded at an
  # address that is reachable, so a match against something that is
  # not on this machine is a question of routing rather than of
  # being impossible.
  #
  # Everything the console is told stays where it was. The served
  # patch, rpcn.yml and the DNS address below all name this
  # machine's own address on the network and all three are reached
  # from inside the namespace, proved on 2026-09-02 with the ticket
  # answered in 268 bytes and the patch returned in 40160.
  Bind address: 0.0.0.0
  Clans Enabled: false
  # This machine, on its address on the network, which is where
  # dnsmasq answers. See amaru/console-rig.nix.
  #
  # **Not a fallback any more.** It read that way while the swap
  # list below carried a wildcard and caught every name before a
  # resolver was ever asked. That list is empty now, so this is
  # the only thing that resolves anything at all, for this title.
  #
  # It is the network address rather than a loopback one because
  # a real PlayStation 3 has one field for a name server and has
  # to be able to reach whatever goes in it.
  DNS address: 192.168.178.147
  IP address: 0.0.0.0
  # Empty, because this machine is the console's resolver and the
  # resolver answers every one of these names itself.
  #
  # It used to carry three hostnames plus a `*` catch all, and that
  # was doing real work for as long as the DNS address pointed
  # somewhere that did not answer them. It does not any more. See
  # amaru/console-rig.nix, which names all six hosts this title has
  # ever been seen to ask for and forwards everything else.
  #
  # Why the resolver and not this list. A real PlayStation 3 has one
  # field for a name server and no swap list at all, so anything that
  # only works here is a thing that has to be found again on
  # hardware. Doing it in one place means the console and the
  # emulator take the same path.
  #
  # What RPCS3 does with an empty list, read rather than assumed.
  # analyze_dns_packet returns -1 when nothing matches,
  # np_dnshook.cpp:181, the send falls through to a real sendto, and
  # the destination is overwritten with the DNS address above on the
  # way out, lv2_socket_native.cpp:919. So an empty list means every
  # query goes to that resolver, whichever nameserver the game
  # thought it was asking.
  #
  # The VPN does not eat those queries. Its output chain rejects
  # udp dport 53, but `oif "lo" accept` is the first rule in it and
  # the console binds 127.0.0.1 above, so a query to this machine
  # never leaves the loopback.
  #
  # **What is given up, and it is not nothing.** The old `*` caught
  # a hostname nobody has ever seen this title ask for. The resolver
  # names hosts rather than domains, because it is this machine's own
  # resolver as well as the console's and a domain entry there would
  # take the studio's website away from the browser on this desktop.
  # So a bucket that has never appeared resolves for real and that
  # request leaves this machine.
  #
  # The title builds content hostnames from three templates at
  # 0x00b3a5f8 in its own executable, two of them with a bucket
  # substituted in, so a new bucket is a thing that can happen rather
  # than a thing that cannot. `s3.amazonaws.com` is already in that
  # position: this title really does use it, for shared replay
  # upload, and it is deliberately not in the resolver because
  # overriding it there would break S3 for this whole desktop.
  #
  # If a request is ever seen leaving for Amazon, this list is where
  # to catch it, one entry, because this list reaches only RPCS3.
  IP swap list: ""
  Internet enabled: Connected
  PSN Country: us
  PSN status: RPCN
  # Off, because it cannot succeed and is not free. RPCS3
  # asks the router to open the peer to peer port, there is no
  # router to ask inside a VPN tunnel, and the search runs a
  # full eight seconds into a timeout on every single launch.
  UPNP Enabled: false
