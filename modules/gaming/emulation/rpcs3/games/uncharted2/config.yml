  Resolution: 1280x720
  # Three times the title's own 1280x720, which is 3840x2160 exactly.
  #
  # A multiplier rather than an output size, because this scales the
  # render targets the game draws into and the game's own resolution
  # is what it is multiplying. 150 gave 1920x1080 and 300 gives 4K
  # with no fractional pixel anywhere, which is the reason to prefer
  # a whole multiple over any number that merely reaches 2160.
  #
  # Resolution Scale Threshold is deliberately not set. It decides
  # which render targets are scaled at all, its default of 16x16
  # leaves the small ones alone, and a target that should not have
  # been scaled shows up as a broken overlay rather than as anything
  # that names itself.
