  # 60, which is what a console delivers, and not the 240 this carried before.
  #
  # WHY IT WAS RAISED AND WHY IT DOES NOT BELONG HERE. Raising this is how a
  # game that paces itself on vblank is made to run faster, because the guest
  # gets its interrupts four times as often. Uncharted 2 does not need that.
  # The framelock this machine patches to 0, which is "Unlock FPS" at
  # 0x000c26f0, is the game's own limiter, and with it off the vblank rate is
  # not what holds the frame rate down.
  #
  # WHAT IT COST. Everything the game paces by counting vblanks runs at four
  # times its speed while the audio keeps its own, which is what the story
  # cutscenes running fast and out of sync with the sound looks like. RPCS3
  # says as much about this setting in Emu/system_config.h, "Changing this
  # from 60 may affect game speed in unexpected ways".
  #
  # WHAT TO WATCH AFTER THE SWITCH. The frame rate during play. Well above 60
  # means the game never paced on vblank, the 240 bought nothing, and the
  # cutscenes are right again. About 60 means it does pace on vblank after
  # all, and then this is a real trade between frame rate and cutscene speed
  # rather than a setting that was simply wrong.
  Vblank Rate: 60
