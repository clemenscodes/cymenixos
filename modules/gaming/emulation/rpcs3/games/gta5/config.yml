Video:
  3D Display Enabled: false
  3D Display Mode: Disabled
  # True, which is the emulator default, and not the false the
  # Naughty Dog files carry. Approximating the occlusion query
  # results is a way of buying frames from a game that stalls
  # waiting for them, and it costs correctness in anything that
  # reads them back. Nothing says this game is in that position,
  # so it starts on the accurate side.
  Accurate ZCULL stats: true
  Allow Host GPU Labels: false
  Anisotropic Filter Override: 0
  Aspect ratio: 16:9
  Consecutive Frames To Draw: 1
  Consecutive Frames To Skip: 1
  DECR memory layout: false
  Debug Program Analyser: false
  Debug output: false
  Debug overlay: false
  Disable Asynchronous Memory Manager: false
  Disable FIFO Reordering: false
  Disable Hardware ColorSpace Remapping: false
  Disable MSL Fast Math: false
  Disable On-Disk Shader Cache: false
  Disable Vertex Cache: false
  Disable Video Output: false
  Disable Vulkan Memory Allocator: false
  Disable ZCull Occlusion Queries: false
  Driver Recovery Timeout: 1000000
  # 20, like every other game on this host. It is a property of
  # the GPU driver and not of a title.
  Driver Wake-Up Delay: 20
  Enable Frame Skip: false
  FidelityFX CAS Sharpening Intensity: 50
  Force CPU Blit: false
  Force Hardware MSAA Resolve: false
  Force High Precision Z buffer: false
  Frame limit: 60
  Handle RSX Memory Tiling: false
  Log shader programs: false
  MSAA: Disabled
  # 16, the emulator default, because the 160 in the Naughty Dog
  # files only ever mattered alongside their Resolution Scale of
  # 150. It names the smallest surface still worth scaling up,
  # so at a scale of 100 it decides nothing at all, and leaving
  # a chosen looking number on an inert key reads as tuning that
  # is not happening.
  Minimum Scalable Dimension: 16
  Multithreaded RSX: false
  Output Scaling Mode: Bilinear
  Performance Overlay:
    Body Background (hex): '#002339FF'
    Body Color (hex): '#FFE138FF'
    Center Horizontally: false
    Center Vertically: false
    Detail level: None
    Enable Framerate Graph: true
    Enable Frametime Graph: false
    Enabled: false
    Font: n023055ms.ttf
    Font size (px): 6
    Framerate datapoints: 199
    Framerate graph detail level: All
    Frametime datapoints: 170
    Frametime graph detail level: All
    Horizontal Margin (%): 4
    Horizontal Margin (px): 10
    Metrics update interval (ms): 1000
    Opacity (%): 10
    Position: Top Left
    Title Background (hex): '#00000000'
    Title Color (hex): '#F26C24FF'
    Use Window Space: false
    Vertical Margin (%): 7
    Vertical Margin (px): 10
  # False, the emulator default, where The Last of Us sets it.
  # Reading colour buffers back from the GPU is one of the most
  # expensive things RPCS3 can be asked to do, and it is only
  # ever switched on for a game with a concrete symptom that
  # needs it. This one has no such symptom on record, so it
  # would be a large cost bought for nothing.
  Read Color Buffers: false
  Read Depth Buffer: false
  Record With Overlays: true
  # False, the emulator default. Relaxing the ZCULL
  # synchronisation lets the RSX run ahead of queries the game
  # is waiting on, which trades correctness for frames in the
  # titles that stall on them, and shows up as flickering or
  # missing geometry in the ones that do not.
  Relaxed ZCULL Sync: false
  Renderdoc Compatibility Mode: false
  Renderer: Vulkan
  Resolution: 1280x720
  # 100, meaning the native 720p of the console, where the three
  # Naughty Dog titles run at 150. Those are 2010 era games that
  # leave this GPU idle at native resolution, so the scale is
  # spare capacity being spent. GTA V is the heaviest thing the
  # PS3 ever shipped and it is unlikely to leave anything spare.
  # Raising this is the first thing to try once the game is
  # measured, and dropping it back is the first thing to try if
  # it is slow.
  Resolution Scale: 100
  Screen size in inches: 24
  Second Frame Limit: 0
  Shader Compiler Threads: 0
  Shader Loading Dialog:
    Allow custom background: true
    Blur effect strength: 0
    Darkening effect strength: 30
  Shader Mode: Async Recompiler (multi-threaded)
  Shader Precision: High
  Stretch To Display Area: false
  Strict Rendering Mode: false
  Strict Texture Flushing: false
  Texture LOD Bias Addend: 0
  Use GPU texture scaling: false
  Use full RGB output range: true
  VSync: false
  VSync Mode: Disabled
  Vblank NTSC Fixup: false
  # 120, and not the 240 the other games use, because this one is
  # not unlocked, it is doubled. The Naughty Dog titles get an
  # Unlock FPS patch that removes their limiter outright, so the
  # vblank rate above it is free and 240 simply keeps it out of
  # the way. GTA V has no such patch. Its "60 FPS" patch leaves
  # the limiter in place and points it at half the vblank rate,
  # so this number is what decides the frame rate. 120 gives 60,
  # and any other value gives something the game was never built
  # to run at.
  #
  # This value and the "60 FPS" entry in the module's patch list
  # belong together. Neither does anything on its own, and the
  # patch itself only exists for 01.06 because it was relocated
  # there by hand, see games/gta5/patch.yml.
  Vblank Rate: 120
  Vulkan:
    Adapter: ""
    Asynchronous Queue Scheduler: Safe
    Asynchronous Texture Streaming: false
    Asynchronous Texture Streaming 2: true
    Exclusive Fullscreen Mode: Automatic
    FidelityFX CAS Sharpening Intensity: 50
    Force FIFO present mode: false
    Force primitive restart flag: false
    Use Re-BAR for GPU uploads: false
    VRAM allocation limit (MB): 65536
  Write Color Buffers: false
  Write Depth Buffer: false
