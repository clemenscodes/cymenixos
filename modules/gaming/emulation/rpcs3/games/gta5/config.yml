# file next door, games/tlou/config.yml, because everything in
# it that is not about a particular game is about this host, and
# that part is worth carrying. The provenance of those values is
# in games/uncharted2/config.yml.
#
# What is NOT carried is every setting the Naughty Dog titles
# chose for themselves. Those three run the same engine and were
# tuned together, this one is RAGE and shares nothing with them,
# so a workaround that helps there is only a cost here. Each one
# is named at the key it was reverted at, so the divergence can
# be read rather than guessed.
