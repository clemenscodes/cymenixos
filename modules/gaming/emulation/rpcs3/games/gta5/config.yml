  # False, the emulator default, where The Last of Us sets it.
  # Reading colour buffers back from the GPU is one of the most
  # expensive things RPCS3 can be asked to do, and it is only
  # ever switched on for a game with a concrete symptom that
  # needs it. This one has no such symptom on record, so it
  # would be a large cost bought for nothing.
  # True, and it is the other half of Write Color Buffers rather than a
  # second guess at the same symptom.
  #
  # With only the write back on, the character creator draws a face
  # correctly and the same character in a session does not. The creator
  # renders the head and shows it. A session generates the head texture
  # once and then SAMPLES it from the ped's own shader, so the result has
  # to travel back into a texture the next draw reads, and that is the
  # read half. Without it the ped samples nothing and the face comes out
  # flat orange with no eyes while the creator's preview of the same
  # character is right. With both on the textures are right in a session.
  #
  # A NOTE ABOUT WHAT THIS COSTS, BECAUSE IT WAS MEASURED WRONG ONCE
  #
  # Switched on, this game was seen running at between six and sixteen
  # frames where it had been at sixty, and that was written down as the
  # price of the read back. It was not. This machine runs more than one
  # emulated console at a time and another game was running beside it, so
  # the reading was of the machine being shared and not of this setting.
  # Measure a frame rate here with one emulator running or do not measure
  # it at all.
  #
  # With only the write back on, the character creator draws a face
  # correctly and the same character in a session does not. The creator
  # renders the head and shows it. The session generates the head texture
  # once and then SAMPLES it from the ped's own shader, so the result has
  # to travel back into a texture the next draw reads, and that is the
  # read half. Without it the ped samples nothing and the face comes out
  # flat orange with no eyes while the creator's preview of the same
  # character is right.
  #
  # The two together are expensive. They are on for this title because
  # this title has the symptom, and the note further down at Write Color
  # Buffers says the same thing from the other side.
  Read Color Buffers: true
  Read Depth Buffer: false
  Record With Overlays: true
  # False, the emulator default. Relaxing the ZCULL
  # synchronisation lets the RSX run ahead of queries the game
  # is waiting on, which trades correctness for frames in the
  # titles that stall on them, and shows up as flickering or
  # missing geometry in the ones that do not.
  Relaxed ZCULL Sync: false
  Renderdoc Compatibility Mode: false
  Renderer: Vulkan
  Resolution: 1280x720
  # 100, meaning the native 720p of the console, where the three
  # Naughty Dog titles run at 150. Those are 2010 era games that
  # leave this GPU idle at native resolution, so the scale is
  # spare capacity being spent. GTA V is the heaviest thing the
  # PS3 ever shipped and it was unlikely to leave anything
  # spare, so this began at 100 with a note saying that raising
  # it was the first thing to try once the game was measured.
  #
  # **It has been measured and it was raised to 300**, which is
  # three times the console's own resolution in each direction.
  # The host carries an RTX 5090 and the game holds its frame
  # limit there. Dropping this back is still the first thing to
  # try if it ever stops holding, and the key above stops being
  # inert as soon as this is above 100.
  Resolution Scale: 300
  Screen size in inches: 24
  Second Frame Limit: 0
  Shader Compiler Threads: 0
  Shader Loading Dialog:
    Allow custom background: true
    Blur effect strength: 0
    Darkening effect strength: 30
  Shader Mode: Async Recompiler (multi-threaded)
  Shader Precision: High
  Stretch To Display Area: false
  Strict Rendering Mode: false
  Strict Texture Flushing: false
  Texture LOD Bias Addend: 0
  Use GPU texture scaling: false
  Use full RGB output range: true
  VSync: false
  VSync Mode: Disabled
  Vblank NTSC Fixup: false
  # 120, and not the 240 the other games use, because this one is
  # not unlocked, it is doubled. The Naughty Dog titles get an
  # Unlock FPS patch that removes their limiter outright, so the
  # vblank rate above it is free and 240 simply keeps it out of
  # the way. GTA V has no such patch. Its "60 FPS" patch leaves
  # the limiter in place and points it at half the vblank rate,
  # so this number is what decides the frame rate. 120 gives 60,
  # and any other value gives something the game was never built
  # to run at.
  #
  # This value and the "60 FPS" entry in the module's patch list
  # belong together. Neither does anything on its own, and the
  # patch itself only exists for 01.06 because it was relocated
  # there by hand, see games/gta5/patch.yml.
  Vblank Rate: 120
  Vulkan:
    # Named rather than left empty, because this host has two
    # Vulkan devices and the empty string takes whichever one
    # the driver enumerates first. That has been the integrated
    # AMD part, which runs this at a fraction of the speed. The
    # name is the one the emulator itself prints for the card.
    #
    # **This is the one host specific value in the file.** A
    # machine without that card falls back to first enumerated,
    # which is what the empty string always did.
    Adapter: "NVIDIA GeForce RTX 5090"
    Asynchronous Queue Scheduler: Safe
    Asynchronous Texture Streaming: false
    Asynchronous Texture Streaming 2: true
    Exclusive Fullscreen Mode: Automatic
    FidelityFX CAS Sharpening Intensity: 50
    Force FIFO present mode: false
    Force primitive restart flag: false
    # True, because the card and the board both do resizable
    # BAR, so the whole of video memory is addressable at once
    # and an upload no longer goes through a staging window.
    # It is a property of this host rather than of the game.
    Use Re-BAR for GPU uploads: true
    VRAM allocation limit (MB): 65536
  # True, against the emulator default, and against the note at
  # Read Color Buffers a few hundred lines up which says this is
  # only ever switched on for a game with a concrete symptom.
  # This game now has one.
  #
  # GTA Online builds a character's head by blending the parent
  # heads into a render target and then sampling that target back
  # as the head's own diffuse texture. With the write back off
  # there is nothing to sample, so every face in the character
  # creator and every face in a session comes out flat orange
  # with colourless eyes. It is the whole skin and not a detail,
  # which is what makes it easy to mistake for missing data from
  # the server, and it is not. Nothing is asked of the server
  # while the creator is up.
  #
  # Read Color Buffers stays false. Only the write back is needed
  # here, and the two are separate costs.
  Write Color Buffers: true
  Write Depth Buffer: false
